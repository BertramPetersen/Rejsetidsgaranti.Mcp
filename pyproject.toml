[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dsb-claims-mcp"
version = "0.1.0"
description = "Local-first, unofficial MCP scaffold for DSB ticket discovery and claim preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29.0,<2", "pydantic>=2.13.4,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
dsb-claims-mcp = "dsb_claims_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsb_claims_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
